services:
  - type: web
    name: tiny-url-cloak
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: BASE_DOMAIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tiny-url-cloak-db
          property: connectionString
    autoDeploy: true

databases:
  - name: tiny-url-cloak-db
    plan: free
    databaseName: tiny_url_cloak
    user: tiny_url_cloak
