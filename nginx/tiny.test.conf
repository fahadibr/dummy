# Reverse proxy for the tiny-url cloak project.
# Every short link lives on its own subdomain: <code>.tiny.test ->
# Node backend on 127.0.0.1:3001 (the backend tells root-domain requests
# apart from subdomain ones by the Host header, which is why $http_host
# -- not $host -- must be forwarded: it keeps the subdomain *and* the port).
#
# Using `.test` rather than `.local`: macOS reserves `.local` for mDNS/Bonjour
# and ignores /etc/resolver for it, so wildcard DNS there never works. `.test`
# is the IANA-reserved TLD for exactly this (local dev), no such conflict.
#
# Local test setup:
#   1. Wildcard-resolve *.tiny.test to 127.0.0.1 (plain /etc/hosts can't do
#      wildcards - see README's dnsmasq steps).
#   2. Symlink/copy this file into your nginx config, then: nginx -s reload
#   3. Open http://tiny.test:8080/
#
# Production: replace `tiny.test` with your real domain (plus a wildcard
# DNS record and a wildcard TLS cert), and `listen 80;`/`443 ssl;` instead
# of 8080 - see README.

server {
    listen 8080;
    server_name tiny.test *.tiny.test;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend streams proxied pages; avoid buffering delays.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
